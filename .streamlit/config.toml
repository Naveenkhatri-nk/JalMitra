# JalMitra theme (UI redesign, 24 Nov 2026): water-blue accent, soft neutrals; Day (light) and Night (dark).
# The same palettes are in ui_theme.py (CSS variables). Day (light) is the default; Night / System in Settings.

[server]
headless = true
# 27 Nov 2026: the address (localhost) and port 8501 are now given by START_JALMITRA.bat, so the same settings also
# work on Streamlit Community Cloud (the public website), which needs to choose its own address.
# Security: cross-site request protection on, uploads limited to 20 MB.
enableXsrfProtection = true
maxUploadSize = 20
maxMessageSize = 50

[browser]
gatherUsageStats = false

[client]
# Phase 6: hide Streamlit's developer "Deploy" button.
toolbarMode = "minimal"
# Never show Python error details (file paths, code) to visitors; app.py shows a short message with a reference code
showErrorDetails = "none"

[theme]
baseFontSize = 16
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showSidebarBorder = true
chartCategoricalColors = ["#1D6FB8", "#2F7D32", "#8B6B47", "#E0A100", "#6B7C8F"]

[theme.light]
primaryColor = "#1D6FB8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FC"
textColor = "#1C2733"
linkColor = "#1D6FB8"
borderColor = "#E3E8EF"
greenColor = "#1F7A3A"
blueColor = "#1D6FB8"

[theme.light.sidebar]
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2733"

[theme.dark]
primaryColor = "#5AB0F0"
backgroundColor = "#0F1419"
secondaryBackgroundColor = "#161E27"
textColor = "#E6EDF3"
linkColor = "#7CC0F0"
borderColor = "#26323F"
greenColor = "#5CC97F"
blueColor = "#5AB0F0"

[theme.dark.sidebar]
backgroundColor = "#0A0E12"
secondaryBackgroundColor = "#161E27"
textColor = "#E6EDF3"
